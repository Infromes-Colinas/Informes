<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Informe de predicación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F4F6F9; color: #2B2B2B;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; }
    :focus-visible { outline: 2px solid #1F5FA8; outline-offset: 2px; }
    .cabecera { background: #0B2E6B; color: #fff; padding: 28px 20px 24px; }
    .cabecera .interior { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
    .sobretitulo { font-family: Montserrat, Inter, sans-serif; font-weight: 300; font-size: 12px;
      letter-spacing: .2em; color: #9FE3DD; text-transform: uppercase; }
    h1 { font-family: Montserrat, Inter, sans-serif; font-size: 24px; font-weight: 700; margin: 0; }
    h2 { font-family: Montserrat, Inter, sans-serif; font-size: 17px; font-weight: 700; color: #0B2E6B; margin: 0 0 4px; }
    .pastillas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pastilla { padding: 6px 12px; border-radius: 999px; background: #4CC9C0; color: #0B2E6B;
      font-size: 13px; font-weight: 600; }
    .pastilla.clara { background: #23457F; color: #fff; }
    .pastilla:empty { display: none; }
    .contenido { max-width: 520px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .tarjeta { background: #fff; border: 1px solid #E6E8EB; border-radius: 16px; padding: 18px; }
    label.campo { display: block; font-size: 13px; font-weight: 600; color: #55606E; margin: 18px 0 6px; }
    label.campo:first-child { margin-top: 0; }
    select, input[type=text], textarea { width: 100%; min-height: 44px; font-size: 16px; padding: 10px 14px;
      border: 1px solid #7F8A99; border-radius: 12px; background: #fff; color: #2B2B2B; font-family: inherit; }
    select:disabled { background: #F4F6F9; color: #55606E; }
    textarea { min-height: 88px; resize: vertical; }
    .nota { font-size: 13px; color: #55606E; margin-top: 6px; }
    .etiqueta { display: inline-block; font-size: 13px; font-weight: 600; background: #E4F3F8; color: #0B2E6B;
      border-radius: 999px; padding: 4px 12px; margin-top: 10px; }
    .oculto { display: none !important; }
    button { width: 100%; min-height: 48px; margin-top: 24px; padding: 12px; font-size: 16px; font-weight: 600;
      font-family: inherit; color: #fff; background: #1F5FA8; border: 0; border-radius: 12px; cursor: pointer; }
    button:disabled { background: #E6E8EB; color: #55606E; cursor: default; }
    .mensaje { padding: 14px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
    .ok { background: #E2F6F4; color: #0B5A54; }
    .error { background: #FDECEA; color: #A1281B; }
    .obligatorio { color: #A1281B; }
    .pie { text-align: center; font-size: 13px; color: #55606E; padding: 4px 0 24px; }
    .check { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-top: 14px; font-weight: 600; cursor: pointer; }
    .check input { width: 22px; height: 22px; margin: 0; accent-color: #1F5FA8; flex: none; }
    .aviso { font-size: 13px; color: #7A4A00; background: #FFF3DC; border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <header class="cabecera">
    <div class="interior">
      <span class="sobretitulo">Informe de predicación</span>
      <h1 id="titulo">Cargando...</h1>
      <div class="pastillas"><span class="pastilla" id="plazo"></span></div>
    </div>
  </header>

  <main class="contenido">
    <div id="cerrado" class="mensaje error oculto"></div>
    <div id="mensaje" class="mensaje oculto" role="status"></div>

    <form id="formulario" class="tarjeta oculto" autocomplete="off">
      <label class="campo" for="nombre">Nombre del publicador</label>
      <select id="nombre"></select>
      <div id="tipo" class="etiqueta oculto"></div>

      <div id="campos" class="oculto">
        <div id="bloquePublicador">
          <label class="check"><input type="checkbox" id="participo"> Participó en la predicación</label>
        </div>

        <div id="bloqueAuxiliar">
          <label class="check"><input type="checkbox" id="auxiliar"> Fue precursor auxiliar este mes</label>
        </div>

        <div id="bloqueHoras" class="oculto">
          <label class="campo" for="horas">Horas <span class="obligatorio">(obligatorio)</span></label>
          <input type="text" id="horas" inputmode="numeric" maxlength="4">
        </div>

        <label class="campo" for="cursos">Cursos bíblicos dirigidos</label>
        <input type="text" id="cursos" inputmode="numeric" maxlength="4" placeholder="Opcional">
        <div class="nota">Cantidad de cursos distintos.</div>

        <label class="campo" for="comentarios">Comentarios (opcional)</label>
        <textarea id="comentarios" maxlength="200"></textarea>
        <div class="nota"><span id="contador">0</span> de 200 caracteres</div>
        <div class="aviso">No escribas datos de salud ni información de otras personas.</div>

        <button type="submit" id="enviar">Enviar informe</button>
      </div>
    </form>

    <p class="pie">Este enlace es solo para el superintendente de este grupo. No lo compartas.</p>
  </main>

  <script>
    // Servicio de Apps Script que lee y guarda los datos (la hoja de cálculo no es pública).
    var API = 'https://script.google.com/macros/s/AKfycbyS98W9muFcNhCb6zR1I1D1a9CHZhbyggtqo58TP8tKHmasnd9Yp3TOQfcpg0-k6ik/exec';
    var CODIGO = new URLSearchParams(location.search).get('clave') || '';

    // Pide datos al servicio sin enviar las cuentas de Google del navegador.
    function llamar(pedido, alTerminar, alFallar) {
      fetch(API, { method: 'POST', body: JSON.stringify(pedido), credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (r) { if (r.ok) alTerminar(r); else alFallar(new Error(r.error)); })
        .catch(function () { alFallar(new Error('No hay conexión con el servicio. Revisa tu internet e intenta de nuevo.')); });
    }
    var personas = [];
    var $ = function (id) { return document.getElementById(id); };

    function mostrar(id, visible) { $(id).classList.toggle('oculto', !visible); }

    var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto',
      'septiembre', 'octubre', 'noviembre', 'diciembre'];

    function mayuscula(t) { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); }

    // Plazo: día 20 del mes siguiente al mes del informe (por ejemplo, «octubre 2026»).
    function textoPlazo(mes) {
      var partes = String(mes || '').toLowerCase().split(' ');
      var i = MESES.indexOf(partes[0]);
      if (i === -1) return '';
      return 'Plazo: 20 de ' + MESES[(i + 1) % 12];
    }

    function avisar(texto, tipo) {
      var m = $('mensaje');
      m.textContent = texto;
      m.className = 'mensaje ' + tipo;
      mostrar('mensaje', !!texto);
    }

    function llenarLista(lista) {
      personas = lista;
      var sel = $('nombre');
      sel.innerHTML = '';
      var primera = document.createElement('option');
      primera.value = '';
      primera.textContent = lista.length ? 'Elige un nombre' : 'No quedan nombres pendientes';
      sel.appendChild(primera);
      lista.forEach(function (p) {
        var op = document.createElement('option');
        op.value = p.nombre;
        op.textContent = p.nombre;
        sel.appendChild(op);
      });
      sel.disabled = lista.length === 0;
      limpiarCampos();
    }

    function personaElegida() {
      var nombre = $('nombre').value;
      return personas.find(function (p) { return p.nombre === nombre; }) || null;
    }

    function limpiarCampos() {
      $('participo').checked = false;
      $('auxiliar').checked = false;
      $('cursos').value = '';
      $('horas').value = '';
      $('comentarios').value = '';
      $('contador').textContent = '0';
      actualizarVista();
    }

    function actualizarVista() {
      var p = personaElegida();
      mostrar('campos', !!p);
      mostrar('tipo', !!p && p.precursor);
      $('tipo').textContent = 'Precursor';
      if (!p) return;
      var aux = $('auxiliar').checked;
      mostrar('bloquePublicador', !p.precursor);
      mostrar('bloqueAuxiliar', !p.precursor);
      mostrar('bloqueHoras', p.precursor || aux);
      if (!p.precursor && aux) $('participo').checked = true;
      $('participo').disabled = !p.precursor && aux;
    }

    function soloNumero(texto) { return /^[0-9]{0,4}$/.test(texto); }

    $('nombre').addEventListener('change', function () { avisar('', ''); limpiarCampos(); });
    $('auxiliar').addEventListener('change', actualizarVista);
    $('comentarios').addEventListener('input', function () {
      $('contador').textContent = $('comentarios').value.length;
    });

    $('formulario').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var p = personaElegida();
      if (!p) { avisar('Elige un nombre.', 'error'); return; }
      var cursos = $('cursos').value.trim();
      var horas = $('horas').value.trim();
      var pideHoras = p.precursor || $('auxiliar').checked;
      if (!soloNumero(cursos)) { avisar('Los cursos bíblicos deben ser un número entero.', 'error'); return; }
      if (pideHoras && horas === '') { avisar('Escribe las horas.', 'error'); return; }
      if (pideHoras && !soloNumero(horas)) { avisar('Las horas deben ser un número entero.', 'error'); return; }

      var datos = {
        nombre: p.nombre,
        participo: $('participo').checked,
        auxiliar: !p.precursor && $('auxiliar').checked,
        cursos: cursos,
        horas: pideHoras ? horas : '',
        comentarios: $('comentarios').value.trim(),
      };
      $('enviar').disabled = true;
      $('enviar').textContent = 'Enviando...';
      llamar({ accion: 'enviar', clave: CODIGO, datos: datos }, function (r) {
          llenarLista(r.personas);
          avisar('Informe de ' + r.registrado + ' guardado.' +
            (r.personas.length ? ' Puedes elegir el siguiente nombre.' : ' Ya están todos los informes del grupo.'), 'ok');
          $('enviar').disabled = false;
          $('enviar').textContent = 'Enviar informe';
          window.scrollTo(0, 0);
        }, function (e) {
          avisar(e.message || 'No se pudo guardar. Intenta de nuevo.', 'error');
          $('enviar').disabled = false;
          $('enviar').textContent = 'Enviar informe';
        });
    });

    if (!/^[0-9a-f]{32}$/.test(CODIGO)) {
      $('titulo').textContent = 'Informe de predicación';
      $('cerrado').textContent = 'Este enlace no es válido. Pide el enlace correcto al secretario.';
      mostrar('cerrado', true);
    } else {
      llamar({ accion: 'datos', clave: CODIGO }, function (d) {
          $('titulo').textContent = d.grupo + ' · ' + mayuscula(d.mes);
          $('plazo').textContent = textoPlazo(d.mes);
          mostrar('formulario', true);
          llenarLista(d.personas);
        }, function (e) {
          $('titulo').textContent = 'Informe de predicación';
          avisar(e.message || 'No se pudo cargar la lista.', 'error');
        });
    }
  </script>
</body>
</html>
