<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Asistencia a las reuniones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F4F6F9; color: #2B2B2B;
      font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; }
    :focus-visible { outline: 2px solid #1F5FA8; outline-offset: 2px; }
    .cabecera { background: #0B2E6B; color: #fff; padding: 28px 20px 24px; }
    .cabecera .interior { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
    .sobretitulo { font-family: Montserrat, Inter, sans-serif; font-weight: 300; font-size: 12px;
      letter-spacing: .2em; color: #9FE3DD; text-transform: uppercase; }
    h1 { font-family: Montserrat, Inter, sans-serif; font-size: 24px; font-weight: 700; margin: 0; }
    h2 { font-family: Montserrat, Inter, sans-serif; font-size: 17px; font-weight: 700; color: #0B2E6B; margin: 0 0 4px; }
    .pastillas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pastilla { padding: 6px 12px; border-radius: 999px; background: #4CC9C0; color: #0B2E6B;
      font-size: 13px; font-weight: 600; }
    .pastilla.clara { background: #23457F; color: #fff; }
    .pastilla:empty { display: none; }
    .contenido { max-width: 520px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .tarjeta { background: #fff; border: 1px solid #E6E8EB; border-radius: 16px; padding: 18px; }
    label.campo { display: block; font-size: 13px; font-weight: 600; color: #55606E; margin: 18px 0 6px; }
    label.campo:first-child { margin-top: 0; }
    select, input[type=text], textarea { width: 100%; min-height: 44px; font-size: 16px; padding: 10px 14px;
      border: 1px solid #7F8A99; border-radius: 12px; background: #fff; color: #2B2B2B; font-family: inherit; }
    select:disabled { background: #F4F6F9; color: #55606E; }
    textarea { min-height: 88px; resize: vertical; }
    .nota { font-size: 13px; color: #55606E; margin-top: 6px; }
    .etiqueta { display: inline-block; font-size: 13px; font-weight: 600; background: #E4F3F8; color: #0B2E6B;
      border-radius: 999px; padding: 4px 12px; margin-top: 10px; }
    .oculto { display: none !important; }
    button { width: 100%; min-height: 48px; margin-top: 24px; padding: 12px; font-size: 16px; font-weight: 600;
      font-family: inherit; color: #fff; background: #1F5FA8; border: 0; border-radius: 12px; cursor: pointer; }
    button:disabled { background: #E6E8EB; color: #55606E; cursor: default; }
    .mensaje { padding: 14px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
    .ok { background: #E2F6F4; color: #0B5A54; }
    .error { background: #FDECEA; color: #A1281B; }
    .obligatorio { color: #A1281B; }
    .pie { text-align: center; font-size: 13px; color: #55606E; padding: 4px 0 24px; }
    .fila { display: flex; gap: 12px; }
    .fila > div { flex: 1; min-width: 0; }
    .total { display: flex; justify-content: space-between; align-items: center; margin-top: 14px;
      padding: 12px 14px; border-radius: 12px; background: #F4F6F9; color: #55606E; }
    .total strong { font-size: 20px; color: #0B2E6B; font-variant-numeric: tabular-nums; }
    .fija { min-height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px;
      background: #E4F3F8; color: #0B2E6B; font-weight: 600; }
    button.secundario { margin-top: 10px; color: #1F5FA8; background: #E8F0FA; }
    button.chico { width: auto; min-height: 36px; margin: 0; padding: 0 12px; font-size: 14px;
      color: #1F5FA8; background: #fff; border: 1px solid #1F5FA8; border-radius: 10px; }
    .mes { font-weight: 600; margin: 16px 0 4px; text-transform: capitalize; color: #0B2E6B; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 8px 4px; border-bottom: 1px solid #EEF0F2; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #55606E; font-weight: 600; font-size: 13px; }
    .vacio { color: #55606E; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <header class="cabecera">
    <div class="interior">
      <span class="sobretitulo">Colinas de Oro</span>
      <h1>Asistencia a las reuniones</h1>
      <div class="pastillas"><span class="pastilla" id="titulo">Cargando...</span></div>
    </div>
  </header>

  <main class="contenido">
    <div id="cerrado" class="mensaje error oculto"></div>
    <div id="mensaje" class="mensaje oculto" role="status"></div>

    <form id="formulario" class="tarjeta oculto" autocomplete="off">
      <label class="campo" for="fecha">Fecha de la reunión</label>
      <select id="fecha"></select>
      <div id="fechaFija" class="fija oculto"></div>
      <div id="tipo" class="etiqueta oculto"></div>

      <div id="campos" class="oculto">
        <div class="fila">
          <div>
            <label class="campo" for="presencial">Presencial <span class="obligatorio">*</span></label>
            <input type="text" id="presencial" inputmode="numeric" maxlength="4">
          </div>
          <div>
            <label class="campo" for="zoom">Por Zoom <span class="obligatorio">*</span></label>
            <input type="text" id="zoom" inputmode="numeric" maxlength="4">
          </div>
        </div>
        <div class="total"><span>Total</span><strong id="total">0</strong></div>
        <button type="submit" id="enviar">Guardar asistencia</button>
        <button type="button" id="cancelar" class="secundario oculto">Cancelar la corrección</button>
      </div>
    </form>

    <section class="tarjeta oculto" id="bloqueRegistradas">
      <h2>Ya registradas</h2>
      <p class="vacio">Si te equivocaste en una fecha, pulsa «Corregir». Solo se puede mientras el mes esté abierto.</p>
      <div id="registradas"></div>
    </section>

    <p class="pie">Solo cantidades: no se registra quién asistió.</p>
  </main>

  <script>
    // Servicio de Apps Script que lee y guarda los datos (la hoja de cálculo no es pública).
    // Reemplaza el texto entre comillas por la dirección de la aplicación web (termina en /exec).
    var API = 'https://script.google.com/macros/s/AKfycbw1G9eN_oD9HVymOestC5TFbQJ58cc3CzoZOLNt6zVLu8je8n6nOCOLKX2xpna0X1EZSA/exec';
    var CODIGO = new URLSearchParams(location.search).get('clave') || '';
    var pendientes = [];
    var editando = null; // fecha ya registrada que se está corrigiendo
    var $ = function (id) { return document.getElementById(id); };

    function llamar(pedido, alTerminar, alFallar) {
      fetch(API, { method: 'POST', body: JSON.stringify(pedido), credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (r) { if (r.ok) alTerminar(r); else alFallar(new Error(r.error)); })
        .catch(function () { alFallar(new Error('No hay conexión con el servicio. Revisa tu internet e intenta de nuevo.')); });
    }

    function mostrar(id, visible) { $(id).classList.toggle('oculto', !visible); }

    function avisar(texto, tipo) {
      var m = $('mensaje');
      m.textContent = texto;
      m.className = 'mensaje ' + tipo;
      mostrar('mensaje', !!texto);
    }

    function soloNumero(texto) { return /^[0-9]{1,4}$/.test(texto); }

    function cargar(d) {
      $('titulo').textContent = 'Año de servicio ' + d.ano;
      mostrar('formulario', true);
      pendientes = d.pendientes;

      var sel = $('fecha');
      sel.innerHTML = '';
      var primera = document.createElement('option');
      primera.value = '';
      primera.textContent = pendientes.length ? 'Elige una fecha' : 'No hay fechas pendientes';
      sel.appendChild(primera);
      var grupos = {};
      // Las fechas más recientes primero.
      pendientes.slice().reverse().forEach(function (f) {
        if (!grupos[f.mes]) {
          grupos[f.mes] = document.createElement('optgroup');
          grupos[f.mes].label = f.mes.charAt(0).toUpperCase() + f.mes.slice(1);
          sel.appendChild(grupos[f.mes]);
        }
        var op = document.createElement('option');
        op.value = f.fecha;
        op.textContent = f.etiqueta + ' · ' + f.reunion;
        grupos[f.mes].appendChild(op);
      });
      sel.disabled = pendientes.length === 0;
      salirDeCorreccion();
      mostrarRegistradas(d.registradas);
    }

    function mostrarRegistradas(lista) {
      var cont = $('registradas');
      cont.innerHTML = '';
      mostrar('bloqueRegistradas', true);
      if (!lista.length) {
        cont.innerHTML = '<p class="vacio">Todavía no hay asistencia registrada este año.</p>';
        return;
      }
      var meses = [];
      var porMes = {};
      lista.forEach(function (r) {
        if (!porMes[r.mes]) { porMes[r.mes] = []; meses.push(r.mes); }
        porMes[r.mes].push(r);
      });
      meses.reverse().forEach(function (mes) {
        var titulo = document.createElement('div');
        titulo.className = 'mes';
        titulo.textContent = mes;
        cont.appendChild(titulo);
        var tabla = document.createElement('table');
        var enc = tabla.insertRow();
        ['Fecha', 'Presencial', 'Zoom', 'Total', ''].forEach(function (t) {
          var th = document.createElement('th');
          th.textContent = t;
          enc.appendChild(th);
        });
        porMes[mes].forEach(function (r) {
          var fila = tabla.insertRow();
          [r.etiqueta, r.presencial, r.zoom, r.presencial + r.zoom].forEach(function (v) {
            fila.insertCell().textContent = v;
          });
          var celda = fila.insertCell();
          if (r.corregible) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'chico';
            b.textContent = 'Corregir';
            b.addEventListener('click', function () { iniciarCorreccion(r); });
            celda.appendChild(b);
          }
        });
        cont.appendChild(tabla);
      });
    }

    function iniciarCorreccion(r) {
      editando = r;
      avisar('', '');
      mostrar('fecha', false);
      $('fechaFija').textContent = 'Corrigiendo: ' + r.etiqueta + ' · ' + r.reunion;
      mostrar('fechaFija', true);
      mostrar('cancelar', true);
      $('enviar').textContent = 'Guardar corrección';
      $('presencial').value = r.presencial;
      $('zoom').value = r.zoom;
      actualizar();
      window.scrollTo(0, 0);
      $('presencial').focus();
    }

    function salirDeCorreccion() {
      editando = null;
      mostrar('fecha', true);
      mostrar('fechaFija', false);
      mostrar('cancelar', false);
      $('enviar').textContent = 'Guardar asistencia';
      limpiar();
    }

    function textoBoton() { return editando ? 'Guardar corrección' : 'Guardar asistencia'; }

    function elegida() {
      if (editando) return editando;
      var v = $('fecha').value;
      return pendientes.find(function (f) { return f.fecha === v; }) || null;
    }

    function limpiar() {
      $('presencial').value = '';
      $('zoom').value = '';
      actualizar();
    }

    function actualizar() {
      var f = elegida();
      mostrar('campos', !!f);
      mostrar('tipo', !!f);
      if (f) $('tipo').textContent = 'Reunión ' + (f.reunion === 'Entre semana' ? 'de entre semana' : 'del fin de semana');
      var p = Number($('presencial').value) || 0;
      var z = Number($('zoom').value) || 0;
      $('total').textContent = p + z;
    }

    $('fecha').addEventListener('change', function () { avisar('', ''); limpiar(); });
    $('presencial').addEventListener('input', actualizar);
    $('zoom').addEventListener('input', actualizar);
    $('cancelar').addEventListener('click', function () { avisar('', ''); salirDeCorreccion(); });

    $('formulario').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var f = elegida();
      if (!f) { avisar('Elige una fecha.', 'error'); return; }
      var presencial = $('presencial').value.trim();
      var zoom = $('zoom').value.trim();
      if (!soloNumero(presencial)) { avisar('Escribe la asistencia presencial (un número entero, 0 o más).', 'error'); return; }
      if (!soloNumero(zoom)) { avisar('Escribe la asistencia por Zoom (escribe 0 si no hubo).', 'error'); return; }
      var corrigiendo = !!editando;
      $('enviar').disabled = true;
      $('cancelar').disabled = true;
      $('enviar').textContent = 'Guardando...';
      llamar({ accion: corrigiendo ? 'corregir' : 'enviar', clave: CODIGO,
        datos: { fecha: f.fecha, presencial: presencial, zoom: zoom } }, function (r) {
        cargar(r);
        avisar('Asistencia del ' + r.registrado + (corrigiendo ? ' corregida.' : ' guardada.'), 'ok');
        $('enviar').disabled = false;
        $('cancelar').disabled = false;
        window.scrollTo(0, 0);
      }, function (e) {
        avisar(e.message || 'No se pudo guardar. Intenta de nuevo.', 'error');
        $('enviar').disabled = false;
        $('cancelar').disabled = false;
        $('enviar').textContent = textoBoton();
      });
    });

    if (!/^[0-9a-f]{32}$/.test(CODIGO)) {
      $('titulo').textContent = '';
      $('cerrado').textContent = 'Este enlace no es válido. Pide el enlace correcto al secretario.';
      mostrar('cerrado', true);
    } else {
      llamar({ accion: 'datos', clave: CODIGO }, cargar, function (e) {
        $('titulo').textContent = '';
        avisar(e.message || 'No se pudo cargar la información.', 'error');
      });
    }
  </script>
</body>
</html>
